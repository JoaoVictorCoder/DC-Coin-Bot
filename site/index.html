            background: #3b3d43;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5865f2;
        }
    </style>
</head>
<body>

    <!-- MAIN CONTAINER -->
    <div class="bank-container">
        <!-- HEADER -->
        <div class="bank-header">
            <div class="logo">
                <span class="logo-icon">💰</span>
                <span class="logo-text">Coin Bank</span>
            </div>
            <div class="header-actions">
                <div class="user-name-header">👤 <span id="headerUsername">Loading...</span></div>
                <button class="avatar-btn" id="openSettingsModalBtn" title="Settings &amp; Backup">⚙️</button>
            </div>
        </div>

        <!-- BALANCE CARD -->
        <div class="balance-card">
            <div>
                <div class="balance-label">💰 Current Balance</div>
                <div class="balance-value" id="headerBalance">0.00000000 coins</div>
            </div>
            <div class="user-id-row">
                <span id="headerUserId">---</span>
                <button class="copy-btn-sm" id="copyUserIdHeaderBtn">Copy ID</button>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs-nav" id="tabsContainer">
            <button class="tab-btn active" data-tab="transactions">📜 Transactions</button>
            <button class="tab-btn" data-tab="card">💳 Card</button>
            <button class="tab-btn" data-tab="bills">📄 Bills</button>
            <button class="tab-btn" data-tab="transfer">🔄 Transfer</button>
            <button class="tab-btn" data-tab="claim">🎁 Claim</button>
        </div>

        <!-- DYNAMIC CONTENT -->
        <div class="dynamic-content" id="dynamicContent">
            <div class="card-modern" style="text-align:center;">Loading...</div>
        </div>

        <!-- FOOTER -->
        <footer>
            <a href="/terms" target="_blank">📜 Terms of Use</a> &nbsp;|&nbsp;
            <a href="/terms/privacy.html" target="_blank">🔒 Privacy</a> &nbsp;|&nbsp;
            <a href="https://discord.com/oauth2/authorize?client_id=1391067775077978214" target="_blank">🤖 Discord Bot</a> &nbsp;|&nbsp;
            <span>© Coin System 2025</span>
        </footer>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- CONFIRM MODAL -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span id="confirmTitle">Confirm</span>
                <button class="close-btn" onclick="closeConfirmModal()">✕</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage" style="margin-bottom: 1.5rem;"></p>
                <div style="display:flex; gap: 1rem; justify-content: flex-end;">
                    <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
                    <button class="btn btn-danger" id="confirmOkBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BILLS MODAL (toPay / toReceive) -->
    <div id="billsModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span id="billsModalTitle">Bills</span>
                <button class="close-btn" onclick="closeBillsModal()">✕</button>
            </div>
            <div class="modal-body" id="billsModalBody"></div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>⚙️ Account &amp; Backup</span>
                <button class="close-btn" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="modal-body">
                <h4>🔐 Change Credentials</h4>
                <input type="text" id="newUsername" placeholder="New username (optional)">
                <input type="password" id="newPassword" placeholder="New password">
                <input type="password" id="confirmNewPassword" placeholder="Confirm password">
                <button class="btn btn-primary" id="doChangeCredsBtn" style="margin-bottom:16px;">Change</button>
                <hr style="margin:12px 0; border-color:#3b3d43;">

                <h4>💾 Backup Codes</h4>
                <div id="backupListContainer" style="max-height:160px; overflow-y:auto; margin-bottom:12px;"></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <input type="text" id="restoreBackupCode" placeholder="Code to restore" style="flex:1;">
                    <button class="btn btn-secondary" id="doRestoreBackupBtn">Restore</button>
                    <button class="btn btn-success" id="doCreateBackupBtn">Create</button>
                </div>
                <hr style="margin:16px 0;">

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn btn-danger" id="doUnregisterBtn">🗑️ Delete Account</button>
                    <button class="btn btn-secondary" id="doLogoutBtn">🚪 Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIN / REGISTER OVERLAY -->
    <div id="loginRegisterOverlay" style="display:flex; position:fixed; inset:0; background:#1a1b1e; z-index:2000; justify-content:center; align-items:center; padding:1.5rem;">
        <div class="modal-card" style="max-width:420px;">
            <div class="modal-header"><span id="authModalTitle">🔐 Access Account</span></div>
            <div class="modal-body">
                <div id="loginForm">
                    <input type="text" id="loginUsername" placeholder="Username">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <button class="btn btn-primary" id="loginSubmitBtn" style="margin-bottom:8px; width:100%;">Login</button>
                    <button class="btn btn-secondary" id="switchToRegisterBtn" style="width:100%;">Create Account</button>

                    <div id="credentialsHistory" class="credentials-list">
                        <div style="font-size:0.7rem; color:#b5b7bb; margin-bottom:6px;">📁 Previous logins</div>
                        <div id="credentialsListContainer"></div>
                    </div>
                </div>
                <div id="registerForm" style="display:none;">
                    <input type="text" id="regUsername" placeholder="Username">
                    <input type="password" id="regPassword" placeholder="Password">
                    <input type="password" id="regConfirm" placeholder="Confirm password">
                    <button class="btn btn-primary" id="registerSubmitBtn" style="width:100%;">Register</button>
                    <button class="btn btn-secondary" id="switchToLoginBtn" style="margin-top:12px; width:100%;">Back to Login</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        const state = {
            session: null,
            transactionsCache: [],
            claimInterval: null,
            claimRemaining: 0,
            cardCodeHidden: false,
        };

        // ============================================================
        //  HELPERS
        // ============================================================
        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
        }

        function formatCoins(val) {
            return parseFloat(val).toFixed(8);
        }

        function authHeaders() {
            if (!state.session) return {};
            return {
                Authorization: "Bearer " + state.session.sessionId,
                "Content-Type": "application/json"
            };
        }

        function getApiBase() {
            return window.location.origin;
        }

        // ----- Toast -----
        function showToast(message, type = 'info', duration = 3500) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : type === 'warning' ? 'warning' : ''}`;
            const icon = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '✅';
            toast.innerHTML = `${icon} ${escapeHtml(message)}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ----- Loading -----
        function showLoading(text = 'Loading...') {
            const overlay = document.getElementById('loadingOverlay');
            document.querySelector('.loading-text').textContent = text;
            overlay.classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // ----- API Request with loading & error handling -----
        async function apiRequest(url, options = {}, showLoader = true) {
            if (showLoader) showLoading();
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    let errMsg = `Request failed (${res.status})`;
                    try {
                        const data = await res.json();
                        if (data.error) errMsg = data.error;
                        else if (data.message) errMsg = data.message;
                    } catch (_) {}
                    throw new Error(errMsg);
                }
                const data = await res.json();
                return data;
            } catch (err) {
                showToast(err.message || 'Network error', 'error');
                throw err;
            } finally {
                if (showLoader) hideLoading();
            }
        }

        // ----- Copy -----
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(String(text));
                showToast('✅ Copied!');
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = String(text);
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ Copied!');
            }
        }

        // ----- Modal controls -----
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function closeBillsModal() {
            document.getElementById('billsModal').style.display = 'none';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function showConfirm({ title, message, onConfirm }) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('confirmModal').style.display = 'flex';
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const cleanup = () => {
                document.getElementById('confirmModal').style.display = 'none';
                okBtn.removeEventListener('click', handler);
                cancelBtn.removeEventListener('click', cleanup);
            };
            const handler = () => {
                cleanup();
                onConfirm();
            };
            okBtn.addEventListener('click', handler);
            cancelBtn.addEventListener('click', cleanup);
        }

        // ============================================================
        //  AUTH / SESSION
        // ============================================================
        function saveCredential(username, password, userId) {
            let creds = JSON.parse(localStorage.getItem('coinbank_creds') || '[]');
            creds = creds.filter(c => c.userId !== userId);
            creds.unshift({ username, password, userId, lastUsed: Date.now() });
            if (creds.length > 10) creds.pop();
            localStorage.setItem('coinbank_creds', JSON.stringify(creds));
            renderCredentialsList();
        }

        function renderCredentialsList() {
            const container = document.getElementById('credentialsListContainer');
            if (!container) return;
            const creds = JSON.parse(localStorage.getItem('coinbank_creds') || '[]');
            if (!creds.length) {
                container.innerHTML = '<div style="color:#72767d; text-align:center;">No saved accounts</div>';
                return;
            }
            container.innerHTML = creds.map(c => `
                    <div class="cred-card">
                        <div class="cred-info">
                            <span class="cred-user">👤 ${escapeHtml(c.username)}</span><br>
                            🆔 ${c.userId}
                        </div>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="copy-btn" onclick="copyText('${c.userId}')">Copy ID</button>
                            <button class="icon-btn" onclick="downloadUserCreds('${c.userId}','${escapeHtml(c.username)}')">⬇️</button>
                            <button class="btn btn-primary" style="padding:2px 12px; font-size:0.65rem;" onclick="quickLogin('${escapeHtml(c.username)}','${c.password}')">Login</button>
                        </div>
                    </div>
                `).join('');
        }

        window.quickLogin = async (username, password) => {
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
            await performLogin();
        };

        async function performLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) {
                showToast('Please fill in all fields', 'warning');
                return;
            }
            try {
                const data = await apiRequest(`${getApiBase()}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }, true);

                if (data.sessionCreated && data.passwordCorrect) {
                    state.session = {
                        username,
                        sessionId: data.sessionId,
                        userId: data.userId
                    };
                    localStorage.setItem('session', JSON.stringify(state.session));
                    saveCredential(username, password, data.userId);
                    document.getElementById('loginRegisterOverlay').style.display = 'none';
                    startApp();
                } else {
                    showToast('Invalid credentials', 'error');
                }
            } catch (err) {
                showToast(err.message || 'Login failed', 'error');
            }
        }

        async function performRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            if (!username || !password || !confirm) {
                showToast('Please fill all fields', 'warning');
                return;
            }
            if (password !== confirm) {
                showToast('Passwords do not match', 'error');
                return;
            }
            try {
                const data = await apiRequest(`${getApiBase()}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }, true);
                if (data.success) {
                    showToast('Account created! Please login.');
                    document.getElementById('switchToLoginBtn').click();
                } else {
                    showToast(data.error || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast(err.message || 'Registration error', 'error');
            }
        }

        async function doLogout() {
            try {
                await apiRequest(`${getApiBase()}/api/logout`, {
                    method: 'POST',
                    headers: authHeaders()
                }, false);
            } catch (_) {}
            localStorage.removeItem('session');
            state.session = null;
            window.location.reload();
        }

        // ============================================================
        //  DOWNLOAD RECEIPT / USER CARD
        // ============================================================
        window.downloadReceipt = async function(txId) {
            showToast('Generating receipt...');
            try {
                const data = await apiRequest(`${getApiBase()}/api/tx/${txId}`, {
                    headers: authHeaders()
                }, true);
                if (!data.success) throw new Error('Transaction not found');
                const tx = data.tx;
                const width = 1240,
                    height = 1754;
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#000000';
                ctx.font = 'bold 48px Inter, Arial, sans-serif';
                ctx.fillText('Transaction Receipt', 80, 120);

                const dateObj = new Date(tx.date);
                const formattedDate =
                    `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()} at ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}:${String(dateObj.getSeconds()).padStart(2,'0')}`;
                ctx.font = '26px Inter, Arial, sans-serif';
                ctx.fillStyle = '#444';
                ctx.fillText(`Date: ${formattedDate}`, 80, 180);

                ctx.font = '22px monospace';
                ctx.fillStyle = '#000';
                ctx.fillText(`TX ID: ${txId}`, 80, 230);

                ctx.strokeStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(80, 270);
                ctx.lineTo(width - 80, 270);
                ctx.stroke();

                ctx.font = 'bold 30px Inter, Arial, sans-serif';
                ctx.fillStyle = '#000';
                ctx.fillText('From:', 80, 340);
                ctx.font = '26px Inter, Arial, sans-serif';
                ctx.fillText(`${tx.from} (${tx.from})`, 80, 390);

                ctx.font = 'bold 30px Inter, Arial, sans-serif';
                ctx.fillText('To:', 80, 460);
                ctx.font = '26px Inter, Arial, sans-serif';
                ctx.fillText(`${tx.to} (${tx.to})`, 80, 510);

                ctx.fillStyle = '#16a34a';
                ctx.font = 'bold 40px Inter, Arial, sans-serif';
                ctx.fillText(`Amount: ${tx.amountCoins} coins`, 80, 620);

                try {
                    const icon = new Image();
                    icon.src = '/favicon.ico';
                    await new Promise((resolve) => { icon.onload = resolve;
                        icon.onerror = resolve; });
                    ctx.drawImage(icon, width - 260, 40, 180, 180);
                } catch (_) {}

                try {
                    const qrDataUrl = await QRCode.toDataURL(txId, { errorCorrectionLevel: 'H', margin: 1, width: 220 });
                    const qrImg = new Image();
                    qrImg.src = qrDataUrl;
                    await new Promise(resolve => { qrImg.onload = resolve; });
                    const qrX = (width - 220) / 2;
                    const qrY = height - 350;
                    ctx.drawImage(qrImg, qrX, qrY, 220, 220);
                    ctx.fillStyle = '#555';
                    ctx.font = '22px Inter, Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Scan to verify transaction', width / 2, qrY + 260);
                } catch (_) {}

                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${txId}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Receipt downloaded');
                });
            } catch (err) {
                showToast(err.message || 'Error generating receipt', 'error');
            }
        };

        window.downloadUserCreds = async function(userId, username) {
            showToast('Generating user card...');
            try {
                const width = 1240,
                    height = 1754;
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 48px Inter, Arial, sans-serif';
                ctx.fillText('User Credentials', 80, 120);
                ctx.font = '26px Inter, Arial, sans-serif';
                ctx.fillStyle = '#444';
                ctx.fillText(`Username: ${username}`, 80, 200);
                ctx.font = '22px monospace';
                ctx.fillStyle = '#000';
                ctx.fillText(`User ID: ${userId}`, 80, 260);

                try {
                    const icon = new Image();
                    icon.src = '/favicon.ico';
                    await new Promise((resolve) => { icon.onload = resolve;
                        icon.onerror = resolve; });
                    ctx.drawImage(icon, width - 260, 40, 180, 180);
                } catch (_) {}

                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${userId}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('User card downloaded');
                });
            } catch (err) {
                showToast('Error generating card', 'error');
            }
        };

        // ============================================================
        //  REFRESH BALANCE
        // ============================================================
        async function refreshBalanceUI() {
            if (!state.session) return;
            try {
                const data = await apiRequest(`${getApiBase()}/api/user/${state.session.userId}/balance`, {
                    headers: authHeaders()
                }, false);
                document.getElementById('headerBalance').innerText = formatCoins(data.coins) + ' coins';
            } catch (_) {}
        }

        // ============================================================
        //  MODULE LOADERS
        // ============================================================

        // ----- TRANSACTIONS (with Check built-in) -----
        async function loadTransactions() {
            const container = document.getElementById('dynamicContent');
            try {
                const data = await apiRequest(`${getApiBase()}/api/transactions?page=1`, {
                    headers: authHeaders()
                }, true);
                const txs = data.transactions || [];
                state.transactionsCache = txs;

                let html = `
                        <div class="card-modern">
                            <h3 style="margin-bottom:0.8rem;">🔍 Check Transaction</h3>
                            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                                <input type="text" id="checkTxId" placeholder="Transaction ID" style="flex:1; margin-bottom:0;">
                                <button class="btn btn-primary" id="doCheckTxBtn" style="flex-shrink:0;">Check</button>
                            </div>
                            <div id="checkResult" style="margin-top:0.8rem;"></div>
                        </div>
                        <div class="card-modern">
                            <h3>📋 Latest Transactions</h3>
                    `;

                if (!txs.length) {
                    html += `<p style="color:#b5b7bb;">No transactions yet.</p>`;
                } else {
                    for (const t of txs) {
                        html += `
                                <div class="tx-item">
                                    <div class="tx-info">
                                        📅 ${new Date(t.date).toLocaleString()}<br>
                                        🧾 From: <strong>${escapeHtml(t.from_id)}</strong><br>
                                        ➡️ To: <strong>${escapeHtml(t.to_id)}</strong><br>
                                        💰 ${formatCoins(t.amount)} coins<br>
                                        🆔 ${t.id}
                                    </div>
                                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                        <button class="copy-btn" onclick="copyText('${t.id}')">Copy ID</button>
                                        <button class="icon-btn" onclick="downloadReceipt('${t.id}')">⬇️ Receipt</button>
                                    </div>
                                </div>
                            `;
                    }
                }
                html += `</div>`;
                container.innerHTML = html;

                document.getElementById('doCheckTxBtn').onclick = async () => {
                    const txId = document.getElementById('checkTxId').value.trim();
                    if (!txId) {
                        showToast('Enter transaction ID', 'warning');
                        return;
                    }
                    try {
                        const result = await apiRequest(`${getApiBase()}/api/tx/${txId}`, {
                            headers: authHeaders()
                        }, true);
                        if (!result.success) {
                            document.getElementById('checkResult').innerHTML =
                                `<div class="tx-check-result">❌ Invalid transaction</div>`;
                            return;
                        }
                        const t = result.tx;
                        document.getElementById('checkResult').innerHTML = `
                                <div class="tx-check-result">
                                    <strong>📄 Transaction Details</strong><br>
                                    🆔 ID: ${t.id}<br>
                                    📅 Date: ${new Date(t.date).toLocaleString()}<br>
                                    👤 From: ${escapeHtml(t.from)}<br>
                                    👤 To: ${escapeHtml(t.to)}<br>
                                    💰 ${formatCoins(t.amountCoins)} coins<br>
                                    <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                                        <button class="copy-btn" onclick="copyText('${t.id}')">Copy ID</button>
                                        <button class="icon-btn" onclick="downloadReceipt('${t.id}')">⬇️ Download Receipt</button>
                                    </div>
                                </div>
                            `;
                    } catch (_) {
                        document.getElementById('checkResult').innerHTML =
                            `<div class="tx-check-result">❌ Transaction not found</div>`;
                    }
                };
            } catch (err) {
                container.innerHTML = `<div class="card-modern" style="color:#ed4245;">❌ Error loading transactions.</div>`;
            }
        }

        // ----- CARD (sem criação de bill) -----
        async function loadCard() {
            const container = document.getElementById('dynamicContent');
            try {
                const data = await apiRequest(`${getApiBase()}/api/card`, {
                    method: 'POST',
                    headers: authHeaders()
                }, true);
                const cardCode = data.cardCode || 'N/A';
                const userId = state.session.userId;
                const hidden = state.cardCodeHidden;

                container.innerHTML = `
                        <div class="card-modern" style="text-align:center;">
                            <div class="bank-card-wrap">
                                <div class="bank-card">
                                    <div class="magstripe"></div>
                                    <div class="card-chip"></div>
                                    <div class="info">
                                        <div class="id-value">${escapeHtml(userId)}</div>
                                        <div class="code-value ${hidden ? 'hidden' : ''}" id="cardCodeDisplay">${escapeHtml(cardCode)}</div>
                                    </div>
                                </div>
                                <div class="card-actions">
                                    <button class="copy-btn" id="copyCardBtn">Copy Code</button>
                                    <button class="btn btn-warning" id="resetCardBtn">🔄 Reset</button>
                                    <div class="toggle-wrap" id="toggleCardCode">
                                        <span>${hidden ? '👁️ Show' : '🙈 Hide'}</span>
                                        <div class="toggle-switch ${hidden ? '' : 'active'}" id="toggleSwitch">
                                            <div class="knob"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                document.getElementById('copyCardBtn').onclick = () => copyText(cardCode);

                document.getElementById('resetCardBtn').onclick = async () => {
                    try {
                        await apiRequest(`${getApiBase()}/api/card/reset`, {
                            method: 'POST',
                            headers: authHeaders()
                        }, true);
                        showToast('Card reset successfully!');
                        loadCard();
                    } catch (_) { showToast('Reset failed', 'error'); }
                };

                const toggleWrap = document.getElementById('toggleCardCode');
                const toggleSwitch = document.getElementById('toggleSwitch');
                const codeDisplay = document.getElementById('cardCodeDisplay');

                const updateToggle = () => {
                    const isHidden = state.cardCodeHidden;
                    codeDisplay.classList.toggle('hidden', isHidden);
                    toggleSwitch.classList.toggle('active', !isHidden);
                    toggleWrap.querySelector('span').textContent = isHidden ? '👁️ Show' : '🙈 Hide';
                };

                toggleWrap.onclick = () => {
                    state.cardCodeHidden = !state.cardCodeHidden;
                    updateToggle();
                };
            } catch (err) {
                container.innerHTML = `<div class="card-modern" style="color:#ed4245;">❌ Error loading card.</div>`;
            }
        }

        // ----- BILLS (com criar bill + pagar + listar) -----
        async function loadBills() {
            const container = document.getElementById('dynamicContent');
            try {
                const data = await apiRequest(`${getApiBase()}/api/bill/list`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ page: 1 })
                }, true);
                const toPay = data.toPay || [];
                const toReceive = data.toReceive || [];

                let html = `
                        <!-- Criar Bill -->
                        <div class="card-modern">
                            <h3>📄 Create Bill</h3>
                            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                                <input type="text" id="billAmount" placeholder="Amount (coins)" style="flex:1; margin-bottom:0;">
                                <input type="text" id="billFromId" placeholder="Debtor ID (who pays)" style="flex:1.5; margin-bottom:0;">
                            </div>
                            <button class="btn btn-primary" id="createBillBtn" style="margin-top:0.8rem;">Create Bill</button>
                        </div>

                        <!-- Pagar Bill -->
                        <div class="card-modern">
                            <h3>🧾 Pay Bill by ID</h3>
                            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                                <input type="text" id="payBillId" placeholder="Bill ID" style="flex:1; margin-bottom:0;">
                                <button class="btn btn-success" id="doPayBillBtn" style="flex-shrink:0;">Pay</button>
                            </div>
                        </div>

                        <!-- Listar Bills -->
                        <div class="card-modern" style="text-align:center;">
                            <button class="btn btn-primary" id="showToPayBtn" style="margin-right:1rem;">📌 Bills to Pay (${toPay.length})</button>
                            <button class="btn btn-secondary" id="showToReceiveBtn">📥 Bills to Receive (${toReceive.length})</button>
                        </div>
                    `;

                container.innerHTML = html;

                // Create Bill
                document.getElementById('createBillBtn').onclick = async () => {
                    const amount = parseFloat(document.getElementById('billAmount').value);
                    const fromId = document.getElementById('billFromId').value.trim();
                    if (!amount || !fromId) {
                        showToast('Fill all fields', 'warning');
                        return;
                    }
                    try {
                        await apiRequest(`${getApiBase()}/api/bill/create`, {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify({ fromId, toId: state.session.userId, amount })
                        }, true);
                        showToast('Bill created!');
                        loadBills(); // recarrega a lista
                    } catch (_) { showToast('Creation failed', 'error'); }
                };

                // Pay Bill
                document.getElementById('doPayBillBtn').onclick = async () => {
                    const billId = document.getElementById('payBillId').value.trim();
                    if (!billId) {
                        showToast('Enter bill ID', 'warning');
                        return;
                    }
                    try {
                        await apiRequest(`${getApiBase()}/api/bill/pay`, {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify({ billId })
                        }, true);
                        showToast('Bill paid!');
                        refreshBalanceUI();
                        loadBills();
                    } catch (_) { showToast('Payment failed', 'error'); }
                };

                // Show toPay modal
                document.getElementById('showToPayBtn').onclick = () => {
                    let modalHtml = `<h3>🧾 To Pay</h3>`;
                    if (!toPay.length) modalHtml += `<p>No bills to pay.</p>`;
                    else {
                        toPay.forEach(b => {
                            modalHtml += `
                                    <div class="bill-item">
                                        <div class="bill-info">
                                            ID: ${b.id}<br>
                                            From: ${escapeHtml(b.from_id)}<br>
                                            💰 ${formatCoins(b.amount)} coins<br>
                                            📅 ${new Date(b.date).toLocaleString()}
                                        </div>
                                        <div>
                                            <button class="copy-btn" onclick="copyText('${b.id}')">Copy ID</button>
                                            <button class="btn btn-success" style="margin-left:8px;" onclick="payBillAndClose('${b.id}')">Pay</button>
                                        </div>
                                    </div>
                                `;
                        });
                    }
                    document.getElementById('billsModalTitle').innerText = 'Bills to Pay';
                    document.getElementById('billsModalBody').innerHTML = modalHtml;
                    document.getElementById('billsModal').style.display = 'flex';
                };

                // Show toReceive modal
                document.getElementById('showToReceiveBtn').onclick = () => {
                    let modalHtml = `<h3>📥 To Receive</h3>`;
                    if (!toReceive.length) modalHtml += `<p>No bills to receive.</p>`;
                    else {
                        toReceive.forEach(b => {
                            modalHtml += `
                                    <div class="bill-item">
                                        <div class="bill-info">
                                            ID: ${b.id}<br>
                                            To: ${escapeHtml(b.to_id)}<br>
                                            💰 ${formatCoins(b.amount)} coins<br>
                                            📅 ${new Date(b.date).toLocaleString()}
                                        </div>
                                        <div>
                                            <button class="copy-btn" onclick="copyText('${b.id}')">Copy ID</button>
                                        </div>
                                    </div>
                                `;
                        });
                    }
                    document.getElementById('billsModalTitle').innerText = 'Bills to Receive';
                    document.getElementById('billsModalBody').innerHTML = modalHtml;
                    document.getElementById('billsModal').style.display = 'flex';
                };
            } catch (err) {
                container.innerHTML = `<div class="card-modern" style="color:#ed4245;">❌ Error loading bills.</div>`;
            }
        }

        window.payBillAndClose = async (billId) => {
            try {
                await apiRequest(`${getApiBase()}/api/bill/pay`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ billId })
                }, true);
                showToast('Bill paid!');
                refreshBalanceUI();
                loadBills();
                closeBillsModal();
            } catch (_) { showToast('Payment failed', 'error'); }
        };

        // ----- TRANSFER -----
        async function loadTransfer() {
            const container = document.getElementById('dynamicContent');
            container.innerHTML = `
                    <div class="card-modern">
                        <h3>💸 Send Coins</h3>
                        <input type="text" id="transferToId" placeholder="Recipient ID">
                        <input type="number" id="transferAmount" step="0.00000001" placeholder="Amount (coins)">
                        <button class="btn btn-primary" id="doTransferBtn">Transfer</button>
                    </div>
                `;

            document.getElementById('doTransferBtn').onclick = async () => {
                const toId = document.getElementById('transferToId').value.trim();
                const amount = parseFloat(document.getElementById('transferAmount').value);
                if (!toId || isNaN(amount) || amount <= 0) {
                    showToast('Fill valid fields', 'warning');
                    return;
                }
                try {
                    await apiRequest(`${getApiBase()}/api/transfer`, {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({ toId, amount })
                    }, true);
                    showToast('Transfer completed!');
                    refreshBalanceUI();
                } catch (_) { showToast('Transfer failed', 'error'); }
            };
        }

        // ----- CLAIM -----
        async function loadClaim() {
            const container = document.getElementById('dynamicContent');
            container.innerHTML = `
                    <div class="card-modern" style="text-align:center;">
                        <h3>🎁 Daily Reward</h3>
                        <button id="claimBtn" class="btn btn-success" disabled>⏳ Loading...</button>
                        <div id="claimTimer" style="margin-top:12px; font-family:monospace;">--</div>
                    </div>
                `;

            const updateClaimUI = (remaining) => {
                const btn = document.getElementById('claimBtn');
                const timerDiv = document.getElementById('claimTimer');
                if (remaining <= 0) {
                    if (btn) { btn.disabled = false;
                        btn.innerText = '🎁 Claim Now'; }
                    if (timerDiv) timerDiv.innerText = '✅ Ready!';
                    if (state.claimInterval) clearInterval(state.claimInterval);
                } else {
                    if (btn) { btn.disabled = true;
                        btn.innerText = '⏳ Cooldown'; }
                    const secs = Math.floor(remaining / 1000);
                    const h = Math.floor(secs / 3600),
                        m = Math.floor((secs % 3600) / 60),
                        s = secs % 60;
                    if (timerDiv) timerDiv.innerText = `⏱️ ${h}h ${m}m ${s}s`;
                }
            };

            try {
                const data = await apiRequest(`${getApiBase()}/api/claim/status`, {
                    headers: authHeaders()
                }, true);
                const remaining = data.cooldownRemainingMs || 0;
                state.claimRemaining = remaining;
                updateClaimUI(remaining);

                if (state.claimInterval) clearInterval(state.claimInterval);
                if (remaining > 0) {
                    state.claimInterval = setInterval(() => {
                        state.claimRemaining -= 1000;
                        if (state.claimRemaining <= 0) {
                            clearInterval(state.claimInterval);
                            state.claimRemaining = 0;
                        }
                        updateClaimUI(state.claimRemaining);
                    }, 1000);
                }

                document.getElementById('claimBtn').onclick = async () => {
                    try {
                        const result = await apiRequest(`${getApiBase()}/api/claim`, {
                            method: 'POST',
                            headers: authHeaders()
                        }, true);
                        showToast(`🎉 You claimed ${result.claimed} coins!`);
                        refreshBalanceUI();
                        loadClaim();
                    } catch (err) {
                        if (err.message.includes('Cooldown')) {
                            showToast('Cooldown active', 'warning');
                            loadClaim();
                        } else {
                            showToast('Claim failed', 'error');
                        }
                    }
                };
            } catch (_) {
                container.innerHTML =
                    `<div class="card-modern" style="text-align:center;color:#ed4245;">❌ Error loading claim status.</div>`;
            }
        }

        // ============================================================
        //  MODULE DISPATCHER
        // ============================================================
        const moduleMap = {
            transactions: loadTransactions,
            card: loadCard,
            bills: loadBills,
            transfer: loadTransfer,
            claim: loadClaim,
        };

        async function loadModule(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            const loader = moduleMap[tab];
            if (loader) await loader();
            else showToast('Module not found', 'error');
        }

        // ============================================================
        //  SETTINGS / BACKUP
        // ============================================================
        async function refreshBackupList() {
            const container = document.getElementById('backupListContainer');
            try {
                const data = await apiRequest(`${getApiBase()}/api/backup/list`, {
                    method: 'POST',
                    headers: authHeaders()
                }, false);
                const backups = data.backups || [];
                if (!backups.length) {
                    container.innerHTML = '<div style="padding:8px; color:#72767d;">No backups found.</div>';
                    return;
                }
                container.innerHTML = backups.map(code =>
                    `<div class="backup-item"><span class="backup-code">${escapeHtml(code)}</span><button class="copy-btn" onclick="copyText('${code}')">Copy</button></div>`
                ).join('');
            } catch (_) {
                container.innerHTML = '<div style="padding:8px; color:#ed4245;">Error loading backups.</div>';
            }
        }

        async function doCreateBackup() {
            try {
                await apiRequest(`${getApiBase()}/api/backup/create`, {
                    method: 'POST',
                    headers: authHeaders()
                }, true);
                showToast('Backup created!');
                refreshBackupList();
            } catch (_) { showToast('Backup creation failed', 'error'); }
        }

        async function doRestoreBackup() {
            const code = document.getElementById('restoreBackupCode').value.trim();
            if (!code) {
                showToast('Enter a backup code', 'warning');
                return;
            }
            try {
                await apiRequest(`${getApiBase()}/api/backup/restore`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ backupId: code })
                }, true);
                showToast('Restore completed!');
                refreshBalanceUI();
                refreshBackupList();
            } catch (_) { showToast('Restore failed', 'error'); }
        }

        async function changeCredentials() {
            const username = document.getElementById('newUsername').value.trim();
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmNewPassword').value;
            if (pass !== confirm) {
                showToast('Passwords do not match', 'error');
                return;
            }
            try {
                await apiRequest(`${getApiBase()}/api/account/change`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ username: username || undefined, password: pass })
                }, true);
                showToast('Credentials changed! Please login again.');
                doLogout();
            } catch (_) { showToast('Change failed', 'error'); }
        }

        async function doUnregister() {
            showConfirm({
                title: 'Delete Account',
                message: 'Are you sure? This action is irreversible.',
                onConfirm: async () => {
                    try {
                        await apiRequest(`${getApiBase()}/api/account/unregister`, {
                            method: 'POST',
                            headers: authHeaders()
                        }, true);
                        doLogout();
                    } catch (_) { showToast('Deletion failed', 'error'); }
                }
            });
        }

        // ============================================================
        //  APP INIT
        // ============================================================
        function startApp() {
            const s = state.session;
            document.getElementById('headerUsername').innerText = s.username;
            document.getElementById('headerUserId').innerText = s.userId;
            document.getElementById('copyUserIdHeaderBtn').onclick = () => copyText(s.userId);

            refreshBalanceUI();
            setInterval(refreshBalanceUI, 10000);

            loadModule('transactions');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => loadModule(btn.dataset.tab);
            });

            document.getElementById('openSettingsModalBtn').onclick = async () => {
                await refreshBackupList();
                document.getElementById('settingsModal').style.display = 'flex';
            };
            document.getElementById('doCreateBackupBtn').onclick = doCreateBackup;
            document.getElementById('doRestoreBackupBtn').onclick = doRestoreBackup;
            document.getElementById('doChangeCredsBtn').onclick = changeCredentials;
            document.getElementById('doUnregisterBtn').onclick = doUnregister;
            document.getElementById('doLogoutBtn').onclick = doLogout;
        }

        // ============================================================
        //  AUTH INIT
        // ============================================================
        function initAuth() {
            document.getElementById('loginSubmitBtn').onclick = performLogin;
            document.getElementById('switchToRegisterBtn').onclick = () => {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('authModalTitle').innerText = '📝 Register';
            };
            document.getElementById('switchToLoginBtn').onclick = () => {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('authModalTitle').innerText = '🔐 Access Account';
            };
            document.getElementById('registerSubmitBtn').onclick = performRegister;
            renderCredentialsList();
        }

        // ============================================================
        //  BOOT
        // ============================================================
        (function boot() {
            const stored = localStorage.getItem('session');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed.sessionId) {
                        state.session = parsed;
                        document.getElementById('loginRegisterOverlay').style.display = 'none';
                        startApp();
                        return;
                    }
                } catch (_) {}
                localStorage.removeItem('session');
            }
            initAuth();
            document.getElementById('loginRegisterOverlay').style.display = 'flex';
        })();

        // Expose helpers globally
        window.copyText = copyText;
        window.downloadReceipt = downloadReceipt;
        window.downloadUserCreds = downloadUserCreds;
        window.payBillAndClose = payBillAndClose;
        window.closeConfirmModal = closeConfirmModal;
        window.closeBillsModal = closeBillsModal;
        window.closeSettingsModal = closeSettingsModal;
        window.showToast = showToast;
    </script>
</body>
</html>
